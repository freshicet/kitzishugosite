<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Title }}{{ else }}{{ .Title }} – {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ site.Params.description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "wp-content/uploads/2022/02/Screenshot_3-edited.jpg" | absURL }}">
  <link rel="preload" href="/fonts/karla-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <main id="content">
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <div class="footer-band"></div>
    <div class="site-info">
      <a href="https://gohugo.io/">Built with Hugo</a><span class="sep">|</span>Privacy Policy: <a href="/privacy-policy/">Here</a>.
    </div>
  </footer>
</body>
</html>
